<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05050f" />
    <title>Pac-Man — Sullen Studio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%2305050f' width='64' height='64'/><circle fill='%23ffe600' cx='32' cy='32' r='24'/><path fill='%2305050f' d='M32 32 L60 16 L60 48 Z'/></svg>"
    />
  </head>
  <body>
    <div id="app">
      <div id="game-wrap"></div>
      <div id="mobile-ui">
        <button type="button" id="btn-play" class="play">PLAY</button>
        <div id="dpad">
          <button type="button" data-dir="up" aria-label="Up">▲</button>
          <button type="button" data-dir="left" aria-label="Left">◀</button>
          <button type="button" data-dir="down" aria-label="Down">▼</button>
          <button type="button" data-dir="right" aria-label="Right">▶</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
